name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build .app
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Build release
        run: ./bin/bundle.sh

      - name: Zip
        run: |
          ditto -c -k --sequesterRsrc --keepParent LLMUsage.app LLMUsage.zip
          ls -la LLMUsage.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: LLMUsage-${{ github.sha }}
          path: LLMUsage.zip
          if-no-files-found: error
          retention-days: 90

      - name: Auto-bump version (main only)
        if: github.ref == 'refs/heads/main'
        id: bump
        run: |
          set -e
          git fetch --tags --force >/dev/null 2>&1 || true
          LATEST=$(git tag --list 'v*' --sort=-version:refname | head -1)
          if [ -z "$LATEST" ]; then
            NEW_TAG="v1.0.0"
          else
            V="${LATEST#v}"
            IFS='.' read -r MAJOR MINOR PATCH <<< "$V"
            NEW_TAG="v${MAJOR}.${MINOR}.$((PATCH + 1))"
          fi
          echo "tag=$NEW_TAG" >> "$GITHUB_OUTPUT"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "$NEW_TAG"
          git push --tags --force
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        if: steps.bump.outputs.tag || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.bump.outputs.tag || github.ref_name }}
          name: ${{ steps.bump.outputs.tag || github.ref_name }}
          generate_release_notes: true
          files: LLMUsage.zip
          prerelease: false
          fail_on_unmatched_files: true